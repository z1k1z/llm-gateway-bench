model_list:
  - model_name: mock-fast
    litellm_params:
      model: openai/mock-fast
      api_base: http://127.0.0.1:9000/v1
      api_key: sk-upstream-SENTINELUP7f3a2b
  - model_name: mock-realistic
    litellm_params:
      model: openai/mock-realistic
      api_base: http://127.0.0.1:9000/v1
      api_key: sk-upstream-SENTINELUP7f3a2b

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  set_verbose: false
  json_logs: true
  drop_params: true
# Внешних callback-ов нет намеренно: Langfuse или OTel добавили бы сетевой
# вызов на каждый запрос и исказили замер. Профиль prod у всех трёх гейтвеев
# означает одно и то же: расход каждого запроса пишется в свою БД.
